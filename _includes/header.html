<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Semih Güreşçi, home">
      <svg class="brand__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M10 4H4v24h6M22 4h6v24h-6" stroke="currentColor" stroke-width="2"/><path d="m19 10-6 12" stroke="currentColor" stroke-width="2"/></svg>
      <span>Semih Güreşçi</span>
    </a>
    <nav class="nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}#performance" data-section="performance">Results</a>
      <a href="{{ '/' | relative_url }}#work" data-section="work">Work</a>
      <a href="{{ '/' | relative_url }}#experience" data-section="experience">Experience</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' %} aria-current="page"{% endif %}>Writing</a>
      <a href="{{ '/cv/' | relative_url }}"{% if page.url == '/cv/' %} aria-current="page"{% endif %}>CV</a>
    </nav>
    <div class="site-header__actions">
      <a class="btn btn--linkedin btn--small header-linkedin" href="{{ site.social_linkedin }}" target="_blank" rel="noopener">LinkedIn <span aria-hidden="true">↗</span><span class="visually-hidden"> (opens in a new tab)</span></a>
      <a class="btn btn--primary btn--small" href="{{ '/' | relative_url }}#contact">Contact</a>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-controls="mobile-nav" aria-expanded="false" aria-label="Open menu"><span></span><span></span></button>
    </div>
  </div>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation" aria-hidden="true">
    <a href="{{ '/' | relative_url }}#performance">Results</a>
    <a href="{{ '/' | relative_url }}#work">Work</a>
    <a href="{{ '/' | relative_url }}#experience">Experience</a>
    <a href="{{ '/blog/' | relative_url }}">Writing</a>
    <a href="{{ '/cv/' | relative_url }}">CV</a>
    <a href="{{ site.social_linkedin }}" target="_blank" rel="noopener">LinkedIn <span aria-hidden="true">↗</span><span class="visually-hidden"> (opens in a new tab)</span></a>
    <a href="{{ '/' | relative_url }}#contact">Contact</a>
  </nav>
</header>
